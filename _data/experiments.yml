- repo: thermodynamic-susceptibilities
  title: Thermodynamic Susceptibilities for Learning
  site: https://charlesr-w.github.io/thermodynamic-susceptibilities/reports/thermo_phase_report.html
  pushed: 2026-07-06
  kind: experiment report
  blurb: A finite MNIST test of whether Lagrange-multiplier responses can define network capacity. Data and width responses are real; the L2 / weight-decay signal is too weak here for a clean capacity collapse.
  items:
    - { label: "Tabs: Overview, Spec, MNIST Phase, Susceptibilities, Scale, Caveats", url: "" }

