- repo: fitness-value-of-information
  title: The Fitness Value of Information
  subtitle: Bet-hedging in fluctuating environments
  site: https://charlesr-w.github.io/fitness-value-of-information/
  post: /Fitness-Value-of-Information/
  pushed: 2026-02-12
  kind: marimo explorer
  blurb: The Bergstrom–Lachmann model of evolutionary bet-hedging, in the browser. Geometric-mean fitness, the pure-to-mixed strategy transition, Kelly betting, and the fitness value of cues bounded by mutual information.
