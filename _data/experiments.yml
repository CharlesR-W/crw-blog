# Published experiment viewers (GitHub Pages sites), shown on /experiments/.
# `pushed` is a fallback; the page refreshes it from the GitHub API on load and re-sorts.
# `items` is the collapsible list of experiments/sections inside each viewer
# (url is relative to `site` unless it starts with http).
# `thumb` lives in assets/experiments/ (800x500 webp, a figure from the viewer).

- repo: DepthEmbedding
  title: Depth Embedding
  site: https://charlesr-w.github.io/DepthEmbedding/
  pushed: 2026-11-22
  kind: viewer + experiments
  blurb: CIFAR-10 probe images moving through the layers of ResNets, plotted in the low space of one operator per network. Press play to watch the cloud move from input to logits. Companion to Coherent Modes.
  items:
    - { label: "Which kernel gives modes that reproduce and a smooth row for a new image?", url: "#experiments/x-inv-kernel" }
    - { label: "Can the joint coordinate be evaluated from just this site's kernel row?", url: "#experiments/x-inv-sources" }
    - { label: "How much of an activation can K coordinates recover?", url: "#experiments/x-inv-decode" }
    - { label: "Do diffusion wavelets give a better or more interpretable inverse than harmonics?", url: "#experiments/x-inv-wavelets" }
    - { label: "Where do other datasets, noisy and adversarial images land?", url: "#experiments/x-inv-ood" }
    - { label: "Can an activation be given another image's source coordinates, and does the output follow?", url: "#experiments/x-inv-edits" }
    - { label: "Where along depth does an adversarial image leave its class?", url: "#experiments/x-x3-adversarial" }
    - { label: "Do networks trained on other data embed the same probe alike?", url: "#experiments/x-x1-data" }
    - { label: "Do straight paths between two activations cross sharp transitions downstream?", url: "#experiments/x-x4-paths" }
    - { label: "How far can the joint operator's solver scale?", url: "#experiments/x-solver" }

- repo: CoherentModes
  title: Coherent Modes
  subtitle: Towards Characterizing a Neural Network's Native Ontology
  site: https://charlesr-w.github.io/CoherentModes/
  post: /Coherent-Modes/
  pushed: 2026-11-22
  kind: report + explorer
  blurb: A label-free spectral procedure for finding which images a network treats alike, layer by layer and over training. Coherent sets in a ResNet-20 on CIFAR-10, with an interactive explorer.
  items:
    - { label: "What groups of images does the last stage of the network treat alike at the end of training?", url: "#experiments/x-groups" }
    - { label: "When in training does each layer's grouping take its final form?", url: "#experiments/x-when" }
    - { label: "Where along depth does the network redraw its grouping?", url: "#experiments/x-depth" }
    - { label: "Which layer's structure does a whole-path block reflect?", url: "#experiments/x-blocks" }
    - { label: "Do the images grouped alike in activations also have similar loss gradients?", url: "#experiments/x-training-signal" }
    - { label: "How much of each layer's walk can k groups keep, and does the spectrum prefer a k?", url: "#experiments/x-coarse" }
    - { label: "Is the constructed walk through the layers approximately Markov?", url: "#experiments/x-markov" }
    - { label: "Do different seeds and depths go through matching sequences of operators?", url: "#experiments/x-across-nets" }
    - { label: "How does the eigenfunctions' association with twelve pixel statistics change over training?", url: "#experiments/x-image-stats" }
    - { label: "What does one operator over images and sites find when its functions may change from site to site?", url: "#experiments/x-through-depth" }
    - { label: "Explorer", url: "#explorer" }

